<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AiPLUS · Выберите город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #1e1d2e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  text-decoration: none;
}
.logo-icon {
  height: 46px;
  width: auto;
  transform: rotate(-90deg);
}
.logo-text {
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.5px;
}
.logo-text span { color: #f5920a; }

.tagline {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 44px;
  text-align: center;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 600;
}

.heading {
  font-size: 16px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  margin-bottom: 20px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 480px;
  width: 100%;
}

@media (max-width: 440px) {
  .grid { grid-template-columns: 1fr; max-width: 320px; }
}

.city-card {
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 20px 20px 18px;
  text-decoration: none;
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  min-height: 130px;
}
.city-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 16px 16px 0 0;
}
.city-card:hover {
  background: rgba(255,255,255,0.08);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4);
}

.city-card.shymkent::before { background: #f5920a; }
.city-card.atyrau::before   { background: #2196F3; }
.city-card.astana::before   { background: #43A047; }
.city-card.online::before   { background: #9C27B0; }

.city-card:hover.shymkent { border-color: rgba(245,146,10,0.4); }
.city-card:hover.atyrau   { border-color: rgba(33,150,243,0.4); }
.city-card:hover.astana   { border-color: rgba(67,160,71,0.4); }
.city-card:hover.online   { border-color: rgba(156,39,176,0.4); }

.city-icon {
  font-size: 24px;
  margin-bottom: 12px;
}

.city-name {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.2px;
  margin-bottom: 4px;
  line-height: 1.2;
}

.city-region {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  font-weight: 500;
  line-height: 1.5;
}

.city-arrow {
  position: absolute;
  bottom: 18px;
  right: 18px;
  font-size: 16px;
  font-weight: 700;
  transition: transform 0.2s;
}
.city-card.shymkent .city-arrow { color: #f5920a; }
.city-card.atyrau   .city-arrow { color: #64B5F6; }
.city-card.astana   .city-arrow { color: #81C784; }
.city-card.online   .city-arrow { color: #CE93D8; }

.city-card:hover .city-arrow { transform: translateX(3px); }

.footer {
  margin-top: 40px;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  text-align: center;
}
</style>
</head>
<body>

<div class="logo">
  <img class="logo-icon" src="https://static.tildacdn.pro/tild6138-6238-4632-b230-313838323361/logo.svg" alt="AiPLUS">
  <div class="logo-text">Ai<span>PLUS</span></div>
</div>
<div class="tagline">Калькулятор цен</div>

<div class="heading">Выберите ваш город</div>

<div class="grid">
  <a class="city-card shymkent" href="shymkent.html">
    <div class="city-icon">🌅</div>
    <div class="city-name">Шымкент</div>
    <div class="city-region">Южный Казахстан</div>
    <div class="city-arrow">→</div>
  </a>

  <a class="city-card atyrau" href="atyrau.html">
    <div class="city-icon">🌊</div>
    <div class="city-name">Атырау · Актобе</div>
    <div class="city-region">Западный Казахстан</div>
    <div class="city-arrow">→</div>
  </a>

  <a class="city-card astana" href="astana.html">
    <div class="city-icon">🏛</div>
    <div class="city-name">Астана · Алматы</div>
    <div class="city-region">Север и Юг</div>
    <div class="city-arrow">→</div>
  </a>

  <a class="city-card online" href="online.html">
    <div class="city-icon">💻</div>
    <div class="city-name">Онлайн AiPLUS</div>
    <div class="city-region">Весь Казахстан</div>
    <div class="city-arrow">→</div>
  </a>
</div>

<div class="footer">mektep.aiplus.kz · AiPLUS © 2026</div>

</body>
</html>
